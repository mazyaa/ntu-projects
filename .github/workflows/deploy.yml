name: 🚀 Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      ###################################
      # Build Frontend
      ###################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Modules
        run: npm ci

      - name: Build Assets
        run: npm run build

      ###################################
      # SSH
      ###################################

      - name: Deploy
        uses: appleboy/ssh-action@v1

        with:

          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |

            set -e

            cd /home/u862475871/domains/techno-inovation.com/laravel

            git fetch origin

            git reset --hard origin/main

            composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

            php artisan migrate --force

            php artisan optimize:clear

            php artisan config:cache

            php artisan route:cache

            php artisan view:cache
